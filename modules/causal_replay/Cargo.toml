[package]
name = "causal_replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Replay and projection library for causal event processing"
readme = "README.md"

[features]
default = []
postgres = ["dep:sqlx", "dep:dashmap", "dep:causal_inspector"]
kurrent  = ["dep:kurrentdb", "dep:bytes"]

[dependencies]
causal = { version = "0.11.0", path = "../causal" }
causal_inspector = { version = "0.11.0", path = "../causal_inspector", optional = true }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing.workspace = true
dashmap = { workspace = true, optional = true }
kurrentdb = { version = "1.2", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"]
optional = true

[[test]]
name = "stream_tests"
path = "tests/stream_tests.rs"

[[test]]
name = "pg_event_log_test"
path = "tests/pg_event_log_test.rs"
required-features = ["postgres"]

[[test]]
name = "pg_snapshot_store_test"
path = "tests/pg_snapshot_store_test.rs"
required-features = ["postgres"]

[[test]]
name = "pg_inspector_test"
path = "tests/pg_inspector_test.rs"
required-features = ["postgres"]

[[test]]
name = "mirroring_test"
path = "tests/mirroring_test.rs"

[[test]]
name = "memory_store_conformance_test"
path = "tests/memory_store_conformance_test.rs"

[[test]]
name = "pg_event_log_conformance_test"
path = "tests/pg_event_log_conformance_test.rs"
required-features = ["postgres"]

[[test]]
name = "kurrent_event_log_conformance_test"
path = "tests/kurrent_event_log_conformance_test.rs"
required-features = ["kurrent"]

[[test]]
name = "kurrent_pg_hybrid_test"
path = "tests/kurrent_pg_hybrid_test.rs"
required-features = ["postgres", "kurrent"]

[[test]]
name = "kurrent_event_log_test"
path = "tests/kurrent_event_log_test.rs"
required-features = ["kurrent"]

[[test]]
name = "memory_effect_store_conformance_test"
path = "tests/memory_effect_store_conformance_test.rs"

[[test]]
name = "pg_effect_store_conformance_test"
path = "tests/pg_effect_store_conformance_test.rs"
required-features = ["postgres"]

[[test]]
name = "pg_consumer_lease_test"
path = "tests/pg_consumer_lease_test.rs"
required-features = ["postgres"]
