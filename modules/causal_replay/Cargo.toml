[package]
name = "causal_replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Replay and projection library for causal event processing"
readme = "README.md"

[features]
default = []
postgres = ["dep:sqlx", "dep:dashmap"]

[dependencies]
causal = { version = "0.4.1", path = "../causal" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
dashmap = { workspace = true, optional = true }

[dev-dependencies]
parking_lot.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"]
optional = true

[[test]]
name = "stream_tests"
path = "tests/stream_tests.rs"

[[test]]
name = "pg_event_log_test"
path = "tests/pg_event_log_test.rs"
required-features = ["postgres"]

[[test]]
name = "pg_reactor_outbox_test"
path = "tests/pg_reactor_outbox_test.rs"
required-features = ["postgres"]

[[test]]
name = "pg_snapshot_store_test"
path = "tests/pg_snapshot_store_test.rs"
required-features = ["postgres"]

[[test]]
name = "v03_smoke_test"
path = "tests/v03_smoke_test.rs"
required-features = ["postgres"]

[[test]]
name = "mirroring_test"
path = "tests/mirroring_test.rs"
