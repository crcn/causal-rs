[package]
name = "ai-summarizer-example"
version = "0.4.0"
edition = "2021"
publish = false

[dependencies]
causal = { version = "0.5.0", path = "../../modules/causal" }
causal_replay = { version = "0.5.0", path = "../../modules/causal_replay", features = ["kurrent"] }
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20", features = ["v4", "serde"] }
