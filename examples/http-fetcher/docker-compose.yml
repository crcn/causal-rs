services:
  kurrentdb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest
    container_name: http-fetcher-kurrentdb
    command:
      - --insecure
      - --run-projections=All
      - --enable-atom-pub-over-http
    ports:
      - "2113:2113"   # gRPC + web UI (http://localhost:2113)
      - "1113:1113"   # TCP client
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
      - kurrentdb-logs:/var/log/kurrentdb

  postgres:
    image: postgres:16-alpine
    container_name: http-fetcher-postgres
    environment:
      POSTGRES_DB: causal
      POSTGRES_USER: causal
      POSTGRES_PASSWORD: causal
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causal -d causal"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./causal-init.sql:/docker-entrypoint-initdb.d/01-causal.sql:ro

volumes:
  kurrentdb-data:
  kurrentdb-logs:
  postgres-data:
